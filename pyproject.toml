[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-perturbation-adapter"
version = "1.1.0"
description = "Hybrid MLP perturbation adapter (VCC 2026) with subpopulation-resolved H7 modes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VCC 2026 - L3BA" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
eval = ["cell-eval2"]  # Arc's official evaluator; integrate separately

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
